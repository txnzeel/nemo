[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nemo-decision-intelligence"
version = "0.1.0"
description = "Deterministic synthetic business foundation for evidence-driven decisions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-duckdb>=1.9,<2",
    "duckdb>=1.4,<2",
]

[project.scripts]
nemo = "nemo.cli:main"
nemo-measure = "nemo.measurement:main"
nemo-warehouse = "nemo.warehouse:main"

[project.optional-dependencies]
api = ["fastapi>=0.122,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1"]
snowflake = [
    "dbt-snowflake>=1.10.6,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/nemo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
cache_dir = ".tools/pytest-cache"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
